server:
  port: ${BACKEND_PORT:8080}

spring:
  application:
    name: memoraai-backend
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:memora_db}
    username: ${POSTGRES_USER:memora_user}
    password: ${POSTGRES_PASSWORD:memora_password_dev}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET:memora_super_secret_jwt_key_2026_dev_mode}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8000}

qdrant:
  host: ${QDRANT_HOST:localhost}
  port: ${QDRANT_PORT:6333}
  collection: ${QDRANT_COLLECTION:memories_v2}
  score-threshold: ${QDRANT_SCORE_THRESHOLD:0.35}

minio:
  endpoint: ${MINIO_ENDPOINT:http://${MINIO_HOST:localhost}:${MINIO_PORT:9000}}
  access-key: ${MINIO_ACCESS_KEY:${MINIO_ROOT_USER:minio_admin}}
  secret-key: ${MINIO_SECRET_KEY:${MINIO_ROOT_PASSWORD:minio_password_dev}}
  bucket-name: ${MINIO_BUCKET:memora-media}
  bucket-init-enabled: ${MINIO_BUCKET_INIT_ENABLED:true}

logging:
  level:
    root: INFO
    com.memoraai: DEBUG
